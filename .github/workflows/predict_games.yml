name: Predict World Cup Games

on:
  schedule:
    # Run every 2 hours during local PM hours (12:00 PM to 10:00 PM EDT / 16:00 to 02:00 UTC)
    # This optimizes API usage to only execute when games are active and odds are changing
    - cron: '0 0,2,16,18,20,22 * * *'
  workflow_dispatch:
    # Allow manual triggering of the workflow from GitHub Actions UI

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python main.py

      - name: Commit and push predictions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add results.json
          git commit -m "Auto-update predictions: results.json [skip ci]" || echo "No changes to commit"
          git push
