name: Predict World Cup Games

on:
  schedule:
    # Run every 2 hours from 10:00 AM to 10:00 PM EDT (14:00 to 02:00 UTC)
    # This covers all possible kickoff windows (early, afternoon, prime-time, and nightcap) efficiently
    - cron: '0 0,2,14,16,18,20,22 * * *'
  workflow_dispatch:
    # Allow manual triggering of the workflow from GitHub Actions UI

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python predictor/main.py

      - name: Commit and push predictions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add predictor/results.json
          git commit -m "Auto-update predictions: predictor/results.json [skip ci]" || echo "No changes to commit"
          git push
