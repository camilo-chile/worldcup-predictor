name: Predict World Cup Games

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    # Run daily at 8:00 AM Eastern Time (12:00 UTC in June)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Allow manual triggering of the workflow from GitHub Actions UI

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python predictor/main.py

      - name: Commit and push predictions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add predictor/results.json predictor/metadata.json
          git commit -m "Auto-update predictions: results.json & metadata.json [skip ci]" || echo "No changes to commit"
          git push
